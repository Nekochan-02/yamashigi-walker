name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - name: テスト実行
        run: npm test

      - name: アプリをビルド
        run: npm run tauri build

      - name: 配信用ファイルの準備
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets
          # ポータブル単一exe (インストール不要版)
          Copy-Item "src-tauri/target/release/yamashigi-walker.exe" "release-assets/YamashigiWalker.exe"
          # インストーラー版 (NSIS)
          Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Copy-Item -Destination "release-assets/YamashigiWalker_Installer.exe"

      - name: GitHub Release の作成とアセット添付
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: 手動実行時の Artifact 保存
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: YamashigiWalker-windows
          path: release-assets/*
