[package]
name = "yamashigi-walker"
version = "0.1.0"
description = "ヤマシギがタスクバーの上を歩き続けるデスクトップペット"
authors = []
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[lib]
name = "yamashigi_walker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
